# Samsung SSAI AN3 EPG validation config

mandatory_fields:
  - asset_id
  - cast
  - content_uri
  - desc
  - duration
  - episode_num
  - genre
  - id
  - poster
  - rating
  - title

schedule_mandatory_fields:
  - service_id
  - content_id
  - schedule_id
  - starttime
  - duration

lengths:
  asset_id: 50
  title: 200
  desc: 4000
  poster_url: 2000

thumbnail:
  width: 1920
  height: 1080
  formats:
    - jpg
    - jpeg

# Feed genres are lowercase (e.g. thriller, comedy); include Title Case for allow-list compatibility
genres:
  - drama
  - comedy
  - thriller
  - music
  - romance
